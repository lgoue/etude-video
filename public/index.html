<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#EEF2F6;--sheet:#fff;--ink:#17222E;--mute:#58697A;--line:#D6DFE8;--acc:#2D4F9E;--acc-ink:#fff;--soft:#E6ECF8;--stage:#0F1722}
@media (prefers-color-scheme:dark){:root{--bg:#0E141B;--sheet:#17202A;--ink:#E8EEF4;--mute:#9DAEBE;--line:#2A3743;--acc:#8FB0FF;--acc-ink:#0E141B;--soft:#1F2D45;--stage:#05080C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 1rem 3rem}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:.9rem 0 .7rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
h1{font-size:1rem;margin:0 0 .5rem;font-weight:700;color:var(--mute)}
#pb{display:flex;align-items:center;gap:.8rem}
#gl{white-space:nowrap;color:var(--mute);font-size:.9rem;min-width:7.5rem;text-align:right}
progress{flex:1;height:8px;appearance:none;-webkit-appearance:none;border:0;border-radius:99px;background:var(--line);overflow:hidden}
progress::-webkit-progress-bar{background:var(--line)}
progress::-webkit-progress-value{background:var(--acc);border-radius:99px;transition:width .5s}
progress::-moz-progress-bar{background:var(--acc);border-radius:99px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:1.6rem clamp(1rem,4vw,2.2rem);box-shadow:0 1px 2px rgba(20,30,45,.05),0 14px 34px -20px rgba(20,30,45,.3)}
#app:empty{display:none}
h2{font-size:1.5rem;line-height:1.25;margin:.1rem 0 1rem}
p{margin:.8rem 0}a{color:var(--acc)}
details{margin:.8rem 0;color:var(--mute)}summary{cursor:pointer}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:.7rem 1.4rem;background:var(--acc);color:var(--acc-ink);cursor:pointer;transition:transform .08s,opacity .2s}
button:hover{opacity:.9}button:active{transform:translateY(1px)}
button:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
button#r,button#pp{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input:not([type=radio]):not([type=checkbox]):not([type=range]),select{font:inherit;padding:.55rem .75rem;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);max-width:100%}
input[type=radio],input[type=checkbox]{accent-color:var(--acc);width:1.1rem;height:1.1rem}
.opt{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:12px;margin:.45rem 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:var(--soft)}
.q{padding:1.1rem 0}.q+.q{border-top:1px solid var(--line)}
.q>b{display:block;margin-bottom:.8rem;font-size:1.05rem}
.lk{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.lk label{display:flex;position:relative}
.lk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.lk span{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;font-size:.92rem;padding:.6rem .25rem;overflow-wrap:anywhere;border:1.5px solid var(--line);border-radius:10px;font-weight:700;color:var(--mute);transition:background .15s,color .15s,border-color .15s}
.lk label:hover span{border-color:var(--acc)}
.lk input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.lk input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.ends{display:flex;justify-content:space-between;gap:1rem;font-size:.88rem;color:var(--mute);margin-top:.45rem}
input[type=range]{width:100%;height:28px;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;background:var(--acc);border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--acc)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--acc)}
input[type=range][data-s="0"]::-webkit-slider-thumb{background:var(--sheet);box-shadow:0 0 0 1.5px var(--mute)}
input[type=range][data-s="0"]::-moz-range-thumb{background:var(--sheet);box-shadow:0 0 0 1.5px var(--mute)}
#yt{width:100%;aspect-ratio:16/9;background:var(--stage);border-radius:14px;overflow:hidden;box-shadow:0 20px 44px -22px rgba(0,0,0,.65)}
#yt iframe,#yt video{width:100%;height:100%;display:block}
#pp{margin-top:.9rem}
#w{color:var(--mute);font-size:.95rem}
.note{background:var(--soft);border-left:4px solid var(--acc);padding:.7rem 1rem;border-radius:0 10px 10px 0;margin:1rem 0}
.sec+.sec{border-top:3px solid var(--acc);margin-top:2.6rem;padding-top:1.2rem}
.sec h3{margin:.4rem 0 .3rem;font-size:1.35rem;line-height:1.3;color:var(--ink);padding:.35rem 0 .35rem .7rem;border-left:5px solid var(--acc);background:var(--sheet);position:sticky;top:calc(var(--hh,0px) + var(--nh,0px));z-index:3;box-shadow:0 6px 8px -6px rgba(20,30,45,.18)}
/* Consigne de la vidéo répétée au-dessus des questions, qui reste visible en défilant (titres de section juste en dessous) */
.md>:first-child{margin-top:0}.md p{margin:.7rem 0}.md ul{margin:.5rem 0;padding-left:1.4rem}.md h2,.md h3,.md h4{margin:1rem 0 .5rem}
.q textarea{display:block;width:100%;margin-top:.5rem;font:inherit;padding:.55rem .75rem;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);resize:vertical}.opt-l{color:var(--mute);font-weight:400}
.qa{border:1.5px solid var(--line);border-radius:12px;padding:.6rem 1rem;margin:0 0 1rem}.qa p{margin:.3rem 0}
.note.stick{position:sticky;top:var(--hh,0px);z-index:4;margin:0 0 .8rem;max-height:30vh;overflow:auto;border-radius:0 0 10px 0;box-shadow:0 -6px 0 var(--sheet)}
#qs{margin-top:.8rem}#nx{margin-top:.6rem}
a.btn{display:inline-block;font-weight:700;border-radius:12px;padding:.7rem 1.4rem;background:var(--acc);color:var(--acc-ink);text-decoration:none}
.code{font-size:1.6rem;letter-spacing:.08em;background:var(--soft);padding:.4rem 1rem;border-radius:10px;display:inline-block;user-select:all}
@media (max-width:560px){.lk.txt{grid-auto-flow:row}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap"><header><h1 id="title"></h1><div id="pb" class="hide"><progress id="gp" value="0" max="1"></progress><small id="gl"></small></div></header>
<div id="app" class="sheet"></div></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),qp=new URLSearchParams(location.search),eid=qp.get('e')||decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'').replace(/^index\.html$/,'')),PL={pid:qp.get('PROLIFIC_PID')||'',study:qp.get('STUDY_ID')||'',session:qp.get('SESSION_ID')||''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Markdown simple pour les textes saisis dans l'admin : **gras**, *italique*, [lien](https://…), titres #, listes « - »
const mdInline=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>').replace(/\b_(.+?)_\b/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(src){
  const out=[];let para=[],list=null;
  const flush=()=>{if(para.length)out.push('<p>'+para.join('<br>')+'</p>');para=[];if(list)out.push('<ul>'+list.map(x=>'<li>'+x+'</li>').join('')+'</ul>');list=null;};
  for(const raw of esc(src).split('\n')){const l=raw.trimEnd(),h=l.match(/^(#{1,3})\s+(.*)$/),li=l.match(/^\s*[-*]\s+(.*)$/);
    if(!l.trim())flush();
    else if(h){flush();out.push(`<h${h[1].length+1}>${mdInline(h[2])}</h${h[1].length+1}>`);}
    else if(li){if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[];}(list=list||[]).push(mdInline(li[1]));}
    else{if(list){out.push('<ul>'+list.map(x=>'<li>'+x+'</li>').join('')+'</ul>');list=null;}para.push(mdInline(l));}}
  flush();return out.join('');
}
const api=async(u,b,n=0)=>{try{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return await r.json();}catch(e){if(n<4){await new Promise(r=>setTimeout(r,1000*2**n));return api(u,b,n+1);}throw e;}};
// Décalages des éléments collants : hauteur de l'en-tête (barre de progression) et de la consigne collante
const stickH=()=>{const d=document.documentElement.style,n=document.querySelector('#qs .stick');d.setProperty('--hh',document.querySelector('header').offsetHeight+'px');d.setProperty('--nh',(n?n.offsetHeight:0)+'px');};
addEventListener('scroll',stickH,{passive:true});addEventListener('resize',stickH);
// Retour en haut à chaque nouvelle page (contenu de #app remplacé ; une simple suppression, ex. fin de vidéo, ne compte pas)
new MutationObserver(m=>{if(m.some(x=>x.addedNodes.length))scrollTo(0,0);stickH();}).observe(app,{childList:true});
window.addEventListener('unhandledrejection',()=>alert('Connection problem. Please check your internet connection and reload this page: the answers you have already submitted are saved, and you will be able to continue where you left off.'));
let E,S,ix=0,attempts=1,audioOk=false,ended=false,player,consented=false,mx=0,seeks=0,timer,demoDone=false,doneBlocks=new Set();
// Deux parties : E.first = partie montrée en premier (ordre éventuellement tiré au hasard par le serveur)
const instrOf=p=>p===2?E.intro2:E.instructions,compOf=p=>(p===2?E.comprehension2:E.comprehension)||[];
const k1=()=>{const i=S.videos.findIndex(v=>(v.part||1)!==(S.videos[0].part||1));return i<0?S.videos.length:i;};
const step=()=>(E.consent?1:0)+3+ix+doneBlocks.size+(S&&S.comp2Done?1:0);
function finishScreen(code){
  prog(1e3);
  const done=code?`<p>To confirm your participation on Prolific, click the button below or enter this completion code:</p><p><b class="code">${esc(code)}</b></p><p><a class="btn" href="https://app.prolific.com/submissions/complete?cc=${encodeURIComponent(code)}">Return to Prolific</a></p>`:'<p>You may now close this page.</p>';
  app.innerHTML=(E&&E.end_message?`<div class="md">${md(E.end_message)}</div>`:'<h2>Thank you for taking part!</h2><p>Your answers have been recorded.</p>')+done;
}
function welcome(rs){
  S=rs;doneBlocks=new Set(rs.blocksDone||[]);demoDone=!!rs.demoDone;ix=rs.videos.findIndex(v=>!rs.answered.includes(v.id));if(ix<0)ix=rs.videos.length;
  $('#title').textContent=E.name;prog(step());
  app.innerHTML=`<h2>Welcome back</h2><p>We found your previous session. You have already answered ${rs.answered.length} of ${rs.videos.length} videos, and you can continue where you left off.</p><p><button id="b">Continue</button></p>`;
  $('#b').onclick=()=>loadYT().then(show);
}
// Avant la seconde partie : ses consignes puis la vérification de leur compréhension
// prev : réponses déjà données, gardées cochées après une erreur pour ne corriger que ce qui est faux
function partIntro(p,msg='',prev=[]){
  const cs=compOf(p),txt=instrOf(p);prog(step());
  if(!txt&&!cs.length){S.comp2Done=true;return show();}
  app.innerHTML=`<h2>Part 2</h2>${msg?`<p style="color:#b00">${msg}</p>`:''}<div class="md">${md(txt)}</div>`+
    (cs.length?'<h3>Instructions check</h3>':'')+cs.map((c,i)=>`<div class="q"><b>${esc(c.q)}</b>${c.options.map((o,j)=>`<label class="opt"><input type="radio" name="c${i}" value="${j}"${prev[i]===j?' checked':''}> ${esc(o)}</label>`).join('')}</div>`).join('')+`<p><button id="b">${cs.length?'Submit':'Continue'}</button></p>`;
  $('#b').onclick=async()=>{
    const a=cs.map((_,i)=>{const r=document.querySelector(`input[name=c${i}]:checked`);return r?+r.value:-1;});
    const r=await api('/api/comp2',{session:S.session,comp:a});
    if(!r.ok){partIntro(p,'At least one answer is incorrect. Please re-read the instructions and try again.',a);return scrollTo(0,0);}
    S.comp2Done=true;show();
  };
}
// Questionnaires sans vidéo : avant les vidéos, entre les deux parties, ou après les vidéos
function pendingBlock(){
  const n=S.videos.length,k=k1(),slots=[];
  if(ix===0)slots.push('before');
  if(ix===k&&k<n)slots.push('between');
  if(ix>=n){if(k>=n)slots.push('between');slots.push('after');}
  for(const s of slots){const b=(S.blocks||[]).find(b=>b.slot===s&&!doneBlocks.has(b.id));if(b)return b;}
  return null;
}
// Questions à texte libre : facultatives, réponse enregistrée telle quelle (chaîne)
function collect(qs){const a={};for(const q of qs){if(q.kind==='text'){const t=document.querySelector(`textarea[name=q${q.id}]`);a[q.id]=t?t.value.trim():'';continue;}const el=q.kind==='likert'?document.querySelector(`input[name=q${q.id}]:checked`):document.querySelector(`input[name=q${q.id}]`);if(!el||(q.kind==='slider'&&el.dataset.s!=='1')){alert('Please answer all the questions (move every slider).');return null;}a[q.id]=+el.value;}return a;}
function blockPage(b){
  const blk=arrange(1,b.questions,b.shuffle,b.shuffle_sections);
  prog(step());
  // Le titre du questionnaire reste interne (admin, export) : il n'est pas montré au participant
  app.innerHTML=(b.intro?`<div class="md">${md(b.intro)}</div>`:'')+`<div id="qs">${blk.html}<button id="nx">Next</button></div>`;
  $('#nx').onclick=async()=>{const a=collect(b.questions);if(!a)return;await api('/api/block',{session:S.session,block_id:b.id,answers:a,order:blk.order});doneBlocks.add(b.id);show();};
}
function gone(){document.body.style.cssText='background:#fff;color:#111;margin:0';document.body.innerHTML='<p style="font:700 1.1rem/1.4 system-ui,sans-serif;text-align:center;padding:30vh 1rem 0">PLEASE GO BACK TO PROLIFIC TO GET THE RIGHT LINK FOR YOUR STUDY</p>';}
async function init(){
  if(!eid)return gone();
  E=await api('/api/public/'+encodeURIComponent(eid));if(!E.id)return gone();const tk=(()=>{try{return localStorage.getItem('s'+E.id)||'';}catch(e){return '';}})();
  const rs=await api('/api/resume',{experiment_id:E.id,pid:PL.pid,token:tk});
  if(rs.finished)return finishScreen(rs.code);
  if(rs.resume)return welcome(rs);
  if(E.full)return app.innerHTML='<h2>This study is full</h2><p>All the places have been filled. Thank you for your interest.</p>';
  $('#title').textContent=E.name;E.consent?consent():audio();
}
function prog(k){const c=E.consent?1:0,d=E.has_demo?1:0,V=(S?S.videos.length:E.n_videos+E.n_attention+(E.n_videos2||0)+(E.n_attention2||0))+(S?(S.blocks||[]).length:E.n_blocks||0),tot=c+3+d+V+(E.n_videos2>0?1:0);$('#pb').classList.remove('hide');$('#gp').max=tot;$('#gp').value=Math.min(k,tot);$('#gl').textContent=k>=tot?'Done':`Step ${k+1} / ${tot}`;}
function consent(){prog(0);
  app.innerHTML=`<h2>Consent</h2><div class="md">${md(E.consent)}</div><label class="opt"><input type="checkbox" id="c"> I have read this information and agree to take part.</label><p><button id="b" disabled>Continue</button> <button id="r">I do not agree</button></p>`;
  $('#c').onchange=()=>$('#b').disabled=!$('#c').checked;
  $('#b').onclick=()=>{consented=true;audio();};
  $('#r').onclick=()=>app.innerHTML='<h2>Thank you</h2><p>You have chosen not to take part in this study. Please return the study on Prolific and close this page.</p>';
}
// Ordre : consentement → test audio → consignes → questions sur les consignes
function intro(){prog((E.consent?1:0)+1);app.innerHTML=`<div class="md">${md(instrOf(E.first)||E.instructions)}</div><p><button id="b">Continue</button></p>`;$('#b').onclick=()=>comp();}
function beep(n){const c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.3;o.start(c.currentTime+i*.6);o.stop(c.currentTime+i*.6+.3);}}
function audio(msg=''){prog(E.consent?1:0);
  const n=3+Math.floor(Math.random()*4);
  app.innerHTML=`<h2>Audio check</h2><p style="color:#b00">${msg}</p><p>Turn on your device's sound, then listen to the series of beeps.</p><p><button id="p">▶ Listen</button></p><p>How many beeps did you hear? <input id="n" type="number" min="0" max="20" style="width:4rem"> <button id="ok">Submit</button></p>`;
  $('#p').onclick=()=>beep(n);
  $('#ok').onclick=()=>{if(+$('#n').value===n){audioOk=true;intro();}else audio("Incorrect answer. Please check your sound and try again.");};
}
function comp(msg='',prev=[]){prog((E.consent?1:0)+2);
  app.innerHTML=`<h2>Instructions check</h2><p style="color:#b00">${msg}</p><details ${msg?'open':''}><summary>Reminder of the instructions</summary><div class="md">${md(instrOf(E.first)||E.instructions)}</div></details>`+
  compOf(E.first).map((c,i)=>`<div class="q"><b>${esc(c.q)}</b>${c.options.map((o,j)=>`<label class="opt"><input type="radio" name="c${i}" value="${j}"${prev[i]===j?' checked':''}> ${esc(o)}</label>`).join('')}</div>`).join('')+'<button id="b">Submit</button>';
  $('#b').onclick=async()=>{
    const a=compOf(E.first).map((_,i)=>{const r=document.querySelector(`input[name=c${i}]:checked`);return r?+r.value:-1;});
    const r=await api('/api/start',{experiment_id:E.id,audio_ok:audioOk,attempts,comp:a,consent:consented,prolific:PL,first:E.first});
    if(r.full)return app.innerHTML='<h2>This study is full</h2><p>All the places have been filled. Thank you for your interest.</p>';if(!r.ok){attempts++;return comp('At least one answer is incorrect. Please re-read the instructions and try again.',a);}
    S=r;S.comp2Done=false;ix=0;doneBlocks=new Set();try{localStorage.setItem('s'+E.id,S.session);}catch(e){}loadYT().then(show);
  };
}
function demo(){
  if(!S.demo.length){demoDone=true;return show();}prog((E.consent?1:0)+3+S.videos.length+(S.blocks||[]).length+(S.comp2Done?1:0));
  app.innerHTML='<h2>A few last questions about you</h2>'+S.demo.map(q=>`<div class="q"><b>${esc(q.text)}</b><br>`+(q.kind==='demo_radio'?`<div>${(q.options||'').split(';').map(o=>o.trim()).filter(Boolean).map(o=>`<label class="opt"><input type="radio" name="q${q.id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`:q.kind==='demo_choice'?`<select name="q${q.id}"><option value="">—</option>${(q.options||'').split(';').map(o=>`<option>${esc(o.trim())}</option>`).join('')}</select>`:`<input name="q${q.id}" style="width:100%">`)+'</div>').join('')+'<button id="b">Continue</button>';
  $('#b').onclick=async()=>{const a={};for(const q of S.demo){const el=q.kind==='demo_radio'?document.querySelector(`input[name=q${q.id}]:checked`):document.querySelector(`[name=q${q.id}]`),v=el?el.value.trim():'';if(!v)return alert('Please answer all the questions.');a[q.id]=v;}await api('/api/demo',{session:S.session,answers:a});demoDone=true;show();};
}
// Anti-avance rapide : contrôles masqués, clavier désactivé, retour forcé si saut en avant
function guard(){clearInterval(timer);mx=0;seeks=0;timer=setInterval(()=>{try{const s=player.getPlayerState();if(s!==1&&s!==2&&s!==3)return;const t=player.getCurrentTime();if(t>mx+1.5){seeks++;player.seekTo(mx,true);}else if(t>mx)mx=t;if(player.getPlaybackRate()!==1)player.setPlaybackRate(1);}catch(e){}},500);}
const isYT=s=>s.length===11&&!/[\/:]/.test(s);
// Lecteur HTML5 (Nextcloud / lien direct) avec le même blocage de l'avance rapide
function native(v){
  const el=document.createElement('video');el.src=v.yt;el.playsInline=true;el.preload='auto';el.style.cssText='width:100%;height:100%;background:#000';$('#yt').appendChild(el);
  mx=0;seeks=0;
  el.ontimeupdate=el.onseeking=()=>{if(el.currentTime>mx+1.5){seeks++;el.currentTime=mx;}else if(el.currentTime>mx)mx=el.currentTime;};
  el.onratechange=()=>{el.playbackRate=1;};
  el.onended=()=>{ended=true;$('#qs').classList.remove('hide');$('#w')&&$('#w').remove();};
  el.onerror=()=>{$('#w').textContent='The video failed to load. Please reload the page.';};
  $('#pp').onclick=()=>el.paused?el.play():el.pause();
}
function loadYT(){return new Promise(r=>{if(window.YT&&YT.Player)return r();window.onYouTubeIframeAPIReady=r;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);});}
const qh=q=>q.kind==='text'?`<div class="q"><b>${esc(q.text)}</b> <small class="opt-l">(optional)</small><textarea name="q${q.id}" rows="3" maxlength="2000"></textarea></div>`:`<div class="q"><b>${esc(q.text)}</b>`+(q.kind==='likert'?`<div class="lk${(q.options||'').includes(';')?' txt':''}">${Array.from({length:q.scale},(_,i)=>`<label><input type="radio" name="q${q.id}" value="${i+1}"><span>${(q.options||'').split(';')[i]?.trim()||i+1}</span></label>`).join('')}</div>`:`<input type="range" min="0" max="100" value="50" name="q${q.id}" data-s="0" oninput="this.dataset.s=1">`)+`<div class="ends"><span>${esc(q.left_label)}</span><span>${esc(q.right_label)}</span></div></div>`;
// Sections séparées par une ligne ; les questions cochées « aléatoire » sont mélangées entre elles à l'intérieur de leur section, à chaque vidéo
// shufSec : l'ordre des sections elles-mêmes est tiré au hasard (questionnaires sans vidéo)
function arrange(part,list,all,shufSec){
  const g=[];(list||S.questions.filter(q=>(q.part||1)===part)).forEach(q=>{const n=q.section||'';let x=g.find(y=>y.n===n);if(!x)g.push(x={n,l:[]});x.l.push(q);});
  g.forEach(x=>{const idx=x.l.map((q,i)=>(all||q.shuffle)?i:-1).filter(i=>i>=0),f=idx.map(i=>x.l[i]);for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]];}idx.forEach((p,k)=>x.l[p]=f[k]);});
  if(shufSec)for(let i=g.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[g[i],g[j]]=[g[j],g[i]];}
  return{order:g.flatMap(x=>x.l.map(q=>q.id)),html:g.map(x=>`<div class="sec">${x.n?`<h3>${esc(x.n)}</h3>`:''}${x.l.map(qh).join('')}</div>`).join('')};
}
async function show(){
  clearInterval(timer);try{player&&player.destroy();}catch(e){}
  {const pb=pendingBlock();if(pb)return blockPage(pb);}
  if(ix>=S.videos.length&&S.demo.length&&!demoDone)return demo();
  if(ix>=S.videos.length){const f=await api('/api/finish',{session:S.session});
    if(!f.ok)return app.innerHTML='<h2>Something went wrong</h2><p>Your answers could not be validated. Please reload the page or contact the research team.</p>';
    try{localStorage.removeItem('s'+E.id);}catch(e){}return finishScreen(f.code);}
  const v=S.videos[ix],blk=arrange(S.videos[ix].part||1);ended=false;prog(step());
  if(ix>=k1()&&!S.comp2Done)return partIntro(v.part||1);
  app.innerHTML=`<h2>Video ${ix+1} / ${S.videos.length}</h2>`+(v.qa?`<div class="qa"><p><b>Question:</b> ${esc(v.qa.question)}</p><p><b>Answer A:</b> ${esc(v.qa.a)}</p><p><b>Answer B:</b> ${esc(v.qa.b)}</p></div>`:'')+`<div id="yt"></div><p><button id="pp">⏯ Play / Pause</button></p>`+(v.instruction?`<p class="note">${esc(v.instruction)}</p>`:'')+`<p id="w"><i>Please watch the whole video to unlock the questions.</i></p><div id="qs" class="hide">${v.instruction?`<div class="note stick">${esc(v.instruction)}</div>`:''}${blk.html}<button id="nx">Next</button></div>`;
  if(!isYT(v.yt))native(v);else player=new YT.Player('yt',{videoId:v.yt,playerVars:{rel:0,playsinline:1,controls:0,disablekb:1},events:{onError:()=>{const w=$('#w');if(w)w.textContent='This video cannot be played. Please reload the page or contact the research team.';},onStateChange:e=>{if(e.data===0){ended=true;$('#qs').classList.remove('hide');$('#w').remove();}}}});
  if(isYT(v.yt)){guard();$('#pp').onclick=()=>{try{player.getPlayerState()===1?player.pauseVideo():player.playVideo();}catch(e){}};}
  $('#nx').onclick=async()=>{
    const a=collect(S.questions.filter(q=>(q.part||1)===(v.part||1)));if(!a)return;
    a._seeks=seeks;a._order=blk.order;await api('/api/answer',{session:S.session,video_id:v.id,answers:a,ended});ix++;show();
  };
}
init();

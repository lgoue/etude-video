<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:1000px;margin:1.5rem auto;padding:0 1rem}label{display:block;margin:.4rem 0}textarea,input:not([type=checkbox]){width:100%;box-sizing:border-box;padding:.3rem}input[type=number]{width:6rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:.25rem .5rem;text-align:left}.row input,.row select{width:auto}button{cursor:pointer;padding:.3rem .8rem}</style>
<h1>Administration</h1>
<p><select id="sel" onchange="load()"></select> <button onclick="newExp()">+ Nouvelle expérience</button></p><div id="sum"></div><div id="main"></div>
<script>
const $=s=>document.querySelector(s);let RP=null,CK={},EX=[],cur=null,eq=null,ev=null,QS=[],VS=[],SECS=[];const isYT=s=>s.length===11&&!/[\/:]/.test(s);
const j=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function list(){EX=await j('/api/admin/experiments');$('#sel').innerHTML=EX.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');if(cur&&EX.find(e=>e.id===cur))$('#sel').value=cur;EX.length?load():$('#main').innerHTML='';}
async function newExp(){const n=prompt("Nom de l'expérience ?");if(!n)return;cur=(await j('/api/admin/experiments','POST',{name:n})).id;list();}
async function load(){
  const id=cur=+$('#sel').value,e=EX.find(x=>x.id===id),d=await j('/api/admin/experiments/'+id),PT=await j('/api/admin/experiments/'+id+'/participants');eq=ev=null;QS=d.questions;VS=d.videos;SECS=[...new Set(QS.filter(q=>!q.kind.startsWith('demo')).map(q=>q.section||''))];summary();
  $('#main').innerHTML=`${banner()}<p><button id="vx" onclick="verify()">Vérifier l'expérience</button></p>${RP&&RP.cur===cur?repHtml():''}
<h2>Paramètres</h2>
<p>Lien participants : <a href="/${e.slug||id}" target="_blank">${location.origin}/${e.slug||id}</a> · <a href="/api/admin/experiments/${id}/export.csv">Exporter les réponses (CSV)</a> · Participants : ${d.sessions.total} démarrés, ${d.sessions.done} terminés, ${d.sessions.attfail} avec au moins un piège raté, ${d.sessions.rej} refusé(s)</p>
<p>Lien à donner à Prolific : <code>${esc(location.origin+'/'+(e.slug||id)+'?PROLIFIC_PID={{%PROLIFIC_PID%}}&STUDY_ID={{%STUDY_ID%}}&SESSION_ID={{%SESSION_ID%}}')}</code> <button onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent)">Copier</button></p>
<label>Nom <input id="nm" value="${esc(e.name)}"></label>
<label><input type="checkbox" id="ac" ${e.active?'checked':''}> Expérience active</label>
<label>Adresse de l'étude (vide = déduite du nom ; donne ${location.origin}/votre-adresse)<input id="sl" value="${esc(e.slug)}"></label>
<label>Participants prévus pour l'équilibrage (0 = illimité ; l'étude ne se ferme que lorsque ce nombre de participants ont terminé)<input id="nt" type="number" value="${e.n_target||0}"></label>
<label>Vidéos par participant (hors pièges) <input id="nv" type="number" value="${e.n_videos}"></label>
<label>Vidéos pièges par participant <input id="na" type="number" value="${e.n_attention}"></label>
<label>Code de confirmation Prolific (propre à cette expérience, affiché à la fin ; vide = aucun)<input id="pc" value="${esc(e.prolific_code)}"></label>
<fieldset><legend>Aspects équilibrés entre participants</legend>${[['ability','Niveau (High/Medium/Low)'],['dimension','Dimension (habileté/bienveillance)'],['gender','Genre de l’agent'],['task','Tâche'],['transcript','Genre du transcript']].map(([k,l])=>`<label style="display:inline-block;margin-right:1rem"><input type="checkbox" class="bal" value="${k}" ${(e.balance||'').split(',').includes(k)?'checked':''}> ${l}</label>`).join('')}</fieldset>
<label>Consignes<textarea id="in" rows="6">${esc(e.instructions)}</textarea></label>
<label>Texte de consentement (vide = pas d'étape de consentement)<textarea id="cs" rows="6">${esc(e.consent)}</textarea></label>
<label>Questions de compréhension (JSON : q, options, correct = index de la bonne réponse)<textarea id="co" rows="7">${esc(JSON.stringify(e.comprehension,null,1))}</textarea></label>
<button onclick="save()">Enregistrer</button> <button onclick="del()">Supprimer l'expérience</button>
<h2>Questions posées après chaque vidéo</h2>
<ol>${d.questions.map(q=>`<li>${q.section?'<b>['+esc(q.section)+']</b> ':''}${q.shuffle?'🔀 ':''}[${q.kind}${q.kind=='likert'?' '+q.scale+' pts':''}] ${esc(q.text)} (${esc(q.left_label)} → ${esc(q.right_label)}) ${esc(q.options)} <button onclick="mv(${q.id},-1)">↑</button> <button onclick="mv(${q.id},1)">↓</button> <button onclick="editQ(${q.id})">✎</button> <button onclick="rm('questions',${q.id})">✕</button></li>`).join('')}</ol>
<p class="row"><select id="qk"><option value="likert">Likert</option><option value="slider">Slider</option><option value="demo_text">Démographie : texte libre</option><option value="demo_choice">Démographie : choix</option></select> <input id="qt" placeholder="Texte" style="width:30%"> <input id="qsec" placeholder="Section (optionnel)" style="width:14%"> <label style="display:inline"><input type="checkbox" id="qsh"> 🔀 ordre aléatoire</label> <input id="ql" placeholder="Libellé gauche" style="width:15%"> <input id="qr" placeholder="Libellé droite" style="width:15%"> <input id="qs" type="number" value="7" style="width:4rem" title="Points Likert"> <input id="qo" placeholder="Libellés des boutons Likert, ou choix (démographie), séparés par ;" style="width:32%"> <button id="qb" onclick="addQ()">Ajouter</button></p>
<div>${SECS.length>1||SECS[0]?'Sections : '+SECS.map((s,i)=>`<button onclick="secShuffle(${i})">🔀 ${s?esc(s):'(sans section)'} : tout aléatoire / ordre fixe</button>`).join(' '):''}</div>
<small>Likert : si vous saisissez des libellés (ex. Strongly disagree;Disagree;Neutral;Agree;Strongly agree), il y a un bouton par libellé et le nombre de points est ignoré ; sinon les boutons sont numérotés. Les vidéos pièges sont validées sur toutes les questions Likert (même réponse attendue partout). Sections : les questions de même section sont regroupées et séparées par une ligne ; 🔀 = l'ordre des questions cochées est tiré au sort à chaque vidéo, à l'intérieur de leur section (les autres restent à leur place). L'ordre vu est enregistré dans l'export (question_order).</small>
<h2>Vidéos (${d.videos.length})</h2>
<p><button id="ck" onclick="check()">Vérifier l'accessibilité des vidéos</button> ${ckSummary()}</p>
<div><b>Réponses par modalité</b>${[...new Set(d.bal.map(x=>x.f))].map(f=>`<div>${f} : ${d.bal.filter(x=>x.f===f).map(x=>`${esc(x.v)||'—'} <b>${x.n}</b>`).join(' · ')}</div>`).join('')}</div>
<table><tr><th>YouTube</th><th>Niveau</th><th>Genre</th><th>Tâche</th><th>Transcript</th><th>Dimension</th><th>Piège</th><th>Assignées</th><th>Réponses</th><th>Pièges OK</th><th>Accès</th><th></th></tr>
${d.videos.map(v=>`<tr style="${v.checked_at&&!v.check_ok?'background:#fde8e8':''}"><td><a href="${isYT(v.yt)?'https://youtu.be/':''}${v.yt}" target="_blank">${isYT(v.yt)?v.yt:'lien direct'}</a></td><td>${esc(v.ability)}</td><td>${esc(v.gender)}</td><td>${esc(v.task)}</td><td>${esc(v.transcript)}</td><td>${esc(v.dimension)}</td><td>${v.attention?'attendu : '+v.expected:''}</td><td>${v.assigned}</td><td>${v.answered}${!v.attention&&quotaOf(e,d)?' / '+quotaOf(e,d):''}</td><td>${v.attention?v.att_ok:''}</td><td>${v.checked_at?(v.check_ok?'✅':'❌')+' <small>'+esc(v.check_detail)+'</small>':'—'}</td><td><button onclick="editV(${v.id})">✎</button> <button onclick="rm('videos',${v.id})">✕</button></td></tr>`).join('')}</table>
<h3>Ajouter des vidéos (une par ligne)</h3>
<small>url;niveau;genre;tâche;transcript;dimension[;réponse attendue à toutes les questions Likert (= vidéo piège);consigne facultative affichée sous la vidéo]</small>
<textarea id="vt" rows="5" placeholder="https://youtu.be/XXXXXXXXXXX;High;F;QA;neutre;ability&#10;https://youtu.be/YYYYYYYYYYY;Low;M;Navigation;F;benevolence;2"></textarea>
<button id="vb" onclick="addV()">Ajouter</button>
<h2>Participants</h2>
<p>${targetLine(e,d)}</p>
<p><button onclick="rejectFailed()">Refuser tous ceux qui ont raté un piège</button> <small>(à reporter aussi sur Prolific via leur PID)</small></p>
<table><tr><th>#</th><th>Prolific PID</th><th>État</th><th>Réponses</th><th>Pièges ratés</th><th>Compréhension (essais)</th><th>Audio</th><th>Début</th><th>Statut</th></tr>${PT.map(p=>`<tr style="${p.rejected?'background:#fde8e8':''}"><td>${p.num}</td><td>${esc(p.prolific_pid)}</td><td>${p.completed?'Terminé':p.abandoned?'Remplacé':(Date.now()-new Date(p.created_at)<72e5?'En cours':'Abandonné')}</td><td>${p.n_answered}/${p.n_assigned}</td><td>${p.att_failed}/${p.att_total}</td><td>${p.comp_attempts}</td><td>${p.audio_ok?'✅':'❌'}</td><td>${new Date(p.created_at).toLocaleString('fr-FR')}</td><td>${p.rejected?'Refusé':p.abandoned?'Hors décompte':'Accepté'} <button onclick="rej('${p.id}',${!p.rejected})">${p.rejected?'Rétablir':'Refuser'}</button></td></tr>`).join('')}</table>`;
}
async function save(){let c;try{c=JSON.parse($('#co').value);}catch(e){return alert('JSON de compréhension invalide');}
  const r=await j('/api/admin/experiments/'+cur,'PUT',{name:$('#nm').value,active:$('#ac').checked,n_videos:+$('#nv').value,n_attention:+$('#na').value,instructions:$('#in').value,consent:$('#cs').value,prolific_code:$('#pc').value,n_target:+$('#nt').value||0,slug:$('#sl').value,balance:[...document.querySelectorAll('.bal:checked')].map(x=>x.value).join(','),comprehension:c});if(r&&r.error)return alert('Adresse courte invalide ou déjà utilisée (pas uniquement des chiffres, ni « admin »)');alert('Enregistré');list();}
async function del(){if(confirm('Supprimer cette expérience et toutes ses données ?')){await j('/api/admin/experiments/'+cur,'DELETE');cur=null;list();}}
function editQ(id){const q=QS.find(x=>x.id===id);eq=id;$('#qk').value=q.kind;$('#qt').value=q.text;$('#ql').value=q.left_label;$('#qr').value=q.right_label;$('#qs').value=q.scale;$('#qo').value=q.options||'';$('#qsec').value=q.section||'';$('#qsh').checked=!!q.shuffle;$('#qb').textContent='Enregistrer la modification';$('#qt').focus();}
async function addQ(){if(!$('#qt').value)return;const b={kind:$('#qk').value,text:$('#qt').value,left_label:$('#ql').value,right_label:$('#qr').value,scale:+$('#qs').value,options:$('#qo').value,section:$('#qsec').value.trim(),shuffle:$('#qsh').checked};eq?await j('/api/admin/questions/'+eq,'PUT',b):await j(`/api/admin/experiments/${cur}/questions`,'POST',b);load();}
function editV(id){const v=VS.find(x=>x.id===id);ev=id;$('#vt').value=[(isYT(v.yt)?'https://youtu.be/':'')+v.yt,v.ability,v.gender,v.task,v.transcript,v.dimension||'',v.attention?v.expected:'',v.instruction].join(';').replace(/;+$/,'');$('#vb').textContent='Enregistrer la modification';$('#vt').focus();}async function addV(){
  if(ev){const r=await j('/api/admin/videos/'+ev,'PUT',{text:$('#vt').value});if(r.bad)return alert('Ligne invalide');delete CK[ev];return load();}
  const r=await j(`/api/admin/experiments/${cur}/videos`,'POST',{text:$('#vt').value});
  if(r.bad.length)alert(r.added+' ajoutée(s). Lignes invalides :\n'+r.bad.join('\n'));await load();check();
}
async function summary(){const s=await j('/api/admin/summary');$('#sum').innerHTML=`<h2>Vue d'ensemble</h2><table><tr><th>Expérience</th><th>Participants démarrés</th><th>Terminés</th><th>Refusés</th><th>Réponses</th><th>Vidéos</th><th>Vidéos inaccessibles</th><th>Réponses / vidéo (min – max)</th></tr>`+s.map(e=>`<tr><td>${esc(e.name)}${e.active?'':' (inactive)'}</td><td>${e.total}</td><td>${e.done}</td><td>${e.rej}</td><td>${e.resp}</td><td>${e.nv}</td><td>${e.broken?'<b style="color:#b00">❌ '+e.broken+'</b>':'—'}</td><td>${e.minr??0} – ${e.maxr??0}</td></tr>`).join('')+'</table>';}
function ckSummary(){const r=VS.filter(v=>v.checked_at);if(!r.length)return '';const bad=r.filter(x=>!x.check_ok).length;return bad?`⚠️ ${bad} vidéo(s) inaccessible(s) sur ${r.length}`:`✅ ${r.length} vidéo(s) accessible(s)`;}
async function check(){const b=$('#ck');if(b){b.disabled=true;b.textContent='Vérification en cours…';}CK=await j(`/api/admin/experiments/${cur}/check`,'POST');load();}
async function verify(){const b=$('#vx');if(b){b.disabled=true;b.textContent='Vérification en cours…';}const r=await j(`/api/admin/experiments/${cur}/verify`,'POST');RP={cur,items:r.items};load();}
function repHtml(){const o={error:0,warn:1,ok:2},it=RP.items.slice().sort((a,b)=>o[a.level]-o[b.level]),n=it.filter(x=>x.level==='error').length,w=it.filter(x=>x.level==='warn').length;return `<div style="border:1px solid #ccc;border-radius:8px;padding:.6rem 1rem;margin:.6rem 0"><b>${n?'❌ '+n+' problème(s) bloquant(s)':'✅ Aucun problème bloquant'}${w?' · ⚠️ '+w+' avertissement(s)':''}</b><ul style="margin:.4rem 0">${it.map(x=>`<li>${x.level==='error'?'❌':x.level==='warn'?'⚠️':'✅'} ${esc(x.text)}</li>`).join('')}</ul></div>`;}
function banner(){const b=VS.filter(v=>v.checked_at&&!v.check_ok);return b.length?`<div style="background:#fde8e8;border:1px solid #e0a0a0;border-radius:8px;padding:.6rem 1rem;margin:.6rem 0">❌ <b>${b.length} vidéo(s) inaccessible(s)</b> : ${b.map(v=>esc((isYT(v.yt)?v.yt:'lien direct')+' ('+v.check_detail+')')).join(' · ')}</div>`:'';}
const quotaOf=(e,d)=>{const nv=d.videos.filter(v=>!v.attention).length;return e.n_target&&nv?Math.ceil(e.n_target*e.n_videos/nv):0;};
function targetLine(e,d){const s=d.sessions;if(!e.n_target)return "Aucun objectif défini : renseignez « Participants prévus » dans les paramètres pour suivre l'équilibrage.";const miss=Math.max(0,e.n_target-s.valid-s.active);return `Objectif : <b>${e.n_target}</b> participants · valides terminés : <b>${s.valid}</b> · en cours : ${s.active} · refusés : ${s.rej} → <b>${miss}</b> à recruter pour compléter l'équilibrage (≈ ${quotaOf(e,d)} réponses visées par vidéo). L'étude ne se ferme que lorsque ${e.n_target} participants ont terminé ; si un participant arrive alors que tous les créneaux sont pris (terminés + en cours), le plus ancien participant en cours est considéré comme parti et ses vidéos sont reprises.`;}
async function rej(id,r){await j('/api/admin/sessions/'+id,'PUT',{rejected:r});load();}
async function rejectFailed(){if(!confirm('Refuser tous les participants ayant raté au moins un piège ?'))return;const r=await j(`/api/admin/experiments/${cur}/reject-failed`,'POST');alert(r.n+' participant(s) refusé(s).');load();}
async function mv(id,d){await j('/api/admin/questions/'+id+'/move','POST',{dir:d});load();}
async function secShuffle(i){const s=SECS[i],qs=QS.filter(q=>(q.section||'')===s&&!q.kind.startsWith('demo'));await j(`/api/admin/experiments/${cur}/section-shuffle`,'POST',{section:s,shuffle:!qs.every(q=>q.shuffle)});load();}
async function rm(k,id){if(confirm('Supprimer ?')){await j(`/api/admin/${k}/${id}`,'DELETE');load();}}
list();
</script></html>
